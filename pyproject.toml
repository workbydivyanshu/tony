[project]
name = "tony-agent"
version = "0.4.0-p24"
description = "Tony — free-model-native agent CLI (stdlib-only orchestrator over `opencode run`)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
authors = [{ name = "workbydivyanshu" }]
keywords = ["agent", "opencode", "orchestrator", "cli", "free-models"]

[project.urls]
Repository = "https://github.com/workbydivyanshu/tony"

# Stock tooling config (Tony itself has zero runtime dependencies).
[tool.ruff]
line-length = 120
extend-exclude = [
  "cline", "opencode", "hermes-agent", "oh-my-openagent",
  ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # long CLI help strings are intentional

[tool.ruff.lint.per-file-ignores]
# Test fakes are deliberately compact one-liners (class R: rc=0; stdout=""; ...).
"tests/**" = ["E701", "E702", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["cline", "opencode", "hermes-agent", "oh-my-openagent"]
